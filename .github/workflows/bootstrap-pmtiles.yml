name: PMTiles integrity and bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-pmtiles.yml"
      - "data/VinhLong.pmtiles.sha256"
      - "tools/verify_pmtiles.py"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Stable public URL for the canonical VinhLong.pmtiles archive"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vinhlong-pmtiles-integrity
  cancel-in-progress: false

jobs:
  verify-or-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing archive or bootstrap from a stable URL
        id: pmtiles
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA256: dd17f53abe450c6d31615a09fffd312a84a263381cdd23c117a87a22f0fd68bf
          EXPECTED_SIZE: "94357111"
        run: |
          set -euo pipefail

          if [ -f data/VinhLong.pmtiles ]; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
          elif [ -n "${SOURCE_URL:-}" ]; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            mkdir -p data
            curl --fail --location --retry 5 --retry-delay 2 "$SOURCE_URL" -o data/VinhLong.pmtiles
          else
            echo "mode=external" >> "$GITHUB_OUTPUT"
            echo "::notice::No local PMTiles archive is committed. The WebGIS still supports ?pmtiles=https://... for R2/CDN. Run this workflow manually with source_url to bootstrap the canonical archive."
            exit 0
          fi

          test "$(stat -c%s data/VinhLong.pmtiles)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  data/VinhLong.pmtiles" | sha256sum -c -
          python tools/verify_pmtiles.py data/VinhLong.pmtiles

      - name: Commit canonical archive when bootstrapped
        if: steps.pmtiles.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/VinhLong.pmtiles
          git commit -m "data: add canonical Vinh Long PMTiles archive"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Unable to push PMTiles archive after retries." >&2
          exit 1
